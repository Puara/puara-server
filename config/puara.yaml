# puara-server — artist/operator-facing configuration.
# Values here seed the server-owned `global` state at startup; sensorRate,
# interactionMode and emitRaw can then be changed live from the controller
# dashboard without restarting.

# Sensor streaming ceiling in Hz, pushed to the phones. 100 Hz is an
# R&D/small-N default (<= 5 devices) — browsers deliver what they deliver
# (iOS Safari caps devicemotion around 60 Hz). Lower this for audiences.
sensorRate: 100

# Aggregate computation / OSC emission tick of the bridge, in Hz.
bridgeTick: 30

# Emit per-device raw streams (/puara/audience/<id>/...). At audience scale
# disable and keep only aggregates + events.
emitRaw: true

# sensors = raw streams + touch + events | touch = touch + events | events-only = tap/shake only
interactionMode: sensors

# Which raw streams the phones send at all. Unlike emitRaw (OSC output only),
# these gate the phone→server WiFi uplink too: disabling a stream removes it
# from the state update, so it never crosses the network. Only need
# accelerometer? Set gyro and orientation to false. Live from the dashboard.
#   bytes on the WiFi: accel/gyro/orientation ride in ONE batched update per
#   tick, so dropping two of three cuts payload but not packet count — lower
#   sensorRate to cut packets.
#   OSC datagrams: one per address, so dropping two of three is a 3x cut.
# tap, shake and status are events and are always emitted, in every mode.
streams:
  accel: true
  gyro: true
  orientation: true
  touch: true
  shake: true
  jab: true
  brush: true
  rub: true
  button: true

# Origin the QR codes point at. Leave blank and the server uses its own LAN
# address (env serverAddress, else the first non-internal IPv4 interface) —
# never the dashboard's own URL, which is usually localhost and unreachable
# from a phone. Set this when a hostname points at the server, e.g.
# 'https://connect.sat.qc.ca:8000'. Editable live from the dashboard.
publicAddress: ''

# Upper bound on simultaneous pointers reported per phone.
maxTouches: 5

# puara-gestures descriptor constants (https://github.com/Puara/puara-gestures).
# All editable live from the dashboard's "Gesture settings" panel; editing one
# rebuilds that detector on every phone, resetting its accumulated state.
gestures:
  # shake — leaky integrator on gravity-free acceleration per axis: accumulates
  # while moving above shakeThreshold, leaks below it, snaps to 0 near zero.
  shakeThreshold: 0.5       # m/s^2
  shakeEmitThreshold: 0.05  # report 0 below this, so idle phones send no noise
  shakeFastLeak: 0.6        # leak while above threshold
  shakeSlowLeak: 0.3        # leak while below (lower = faster decay)
  shakeFrequency: 10        # Hz the leak is applied at
  # jab — signed acceleration span inside a rolling window, latched until the
  # next jab. This is what the pre-0.2.0 "shake" actually measured.
  jabThreshold: 5           # m/s^2 span
  jabWindow: 10             # samples
  # brush/rub — leaky integrator on touch movement. brush is signed (direction
  # of travel), rub uses |movement| so back-and-forth accumulates.
  brushLeak: 0.7
  brushFrequency: 100       # Hz
  brushScale: 0.15
  # button — the touch surface as a button: tap/dtap/ttap/press/hold.
  buttonCountInterval: 200  # ms window for multi-tap
  buttonHoldInterval: 5000  # ms a press must last to count as a hold

# Dome sections. Each zone gets its own QR code (player URL + ?zone=<name>).
# A plain QR (no param) lands in "default".
zones:
  - north
  - east
  - south
  - west

# checkin plugin capacity — hard cap on concurrent players.
maxClients: 350

# OSC destinations (UDP). First entry is typically ossia score; add a second
# for SpatGRIS or debugging (oscdump).
oscDestinations:
  - host: 127.0.0.1
    port: 9000
